[package]
name = "shilploka"
version = "1.0.0"
description = "ShilpLoka: Ancient Indian Voxel Sandbox Native Engine Host"
authors = ["ShilpLoka Architects <architects@shilploka.org>"]
license = "MIT"
repository = "https://github.com/shilploka/shilploka"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

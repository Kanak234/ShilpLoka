# Microsoft Store package of ShilpLoka (Tauri → MSIX) on a real Windows machine.
name: windows-msix
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pillow
      - name: Build MSIX (includes 10 s launch smoke test)
        shell: pwsh
        run: packaging\windows\build_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shilploka-windows
          path: |
            dist-msix/*.msix
            dist-msix/*.zip

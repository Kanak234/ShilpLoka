# Microsoft Store package of ShilpLoka (Tauri → MSIX) on a real Windows machine.
name: windows-msix
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write   # lets the job attach the .msix to a GitHub Release
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pillow
      - name: Build MSIX (includes 10 s launch smoke test)
        shell: pwsh
        run: packaging\windows\build_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shilploka-windows
          path: |
            dist-msix/*.msix
            dist-msix/*.zip
      # The Store upload is done from Partner Center; a public Release asset gives the
      # browser a direct URL to the exact file CI built and tested.
      - name: Publish MSIX to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-ChildItem dist-msix/*.msix | Select-Object -First 1
          $tag = "store-" + ($f.BaseName -replace '^[^-]+-','')
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Microsoft Store package $tag" --notes "MSIX built and smoke-tested by windows-msix CI." }
          gh release upload $tag $f.FullName --clobber
